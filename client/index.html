<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AuraWell AI - a wellness assessment and personalized counseling support platform."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>AuraWell AI</title>
    <script>
      // Applies the persisted theme before first paint to avoid a flash of the
      // wrong theme. Mirrors client/src/stores/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('aurawell-theme');
          var resolved =
            stored === 'dark' || stored === 'light'
              ? stored
              : 'dark';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          /* localStorage unavailable — fall back to CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
